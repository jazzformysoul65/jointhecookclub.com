<script>
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  var err = h.get('error_description') || q.get('error_description');
  if(location.hash || location.search) history.replaceState(null, '', location.pathname);
  if(err){
    document.getElementById('c-title').textContent = 'This link didn\'t work';
    document.getElementById('c-text').textContent = 'It may have expired or already been used. Try logging in to The Cook Club — if your email still isn\'t confirmed, sign up again to get a new link.';
  }
})();
</script>
